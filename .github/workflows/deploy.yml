name: Deploy mdBook to GitHub Pages
on:
  push:
    branches:
      - main # Triggers compilation on every push to the main branch
permissions:
  contents: write # Allows the action to write compiled html to the gh-pages branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up mdBook Environment
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Compile Book Static HTML
        run: mdbook build

      - name: Deploy Compiled Site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book # Default output directory for compiled mdBook sites
